name: Build RK Garments APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Download project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          which java

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install cython==0.29.37

      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME/android-sdk"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          rm -rf "$HOME/android-sdk/cmdline-tools/latest"

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$HOME/android-sdk/cmdline-tools/temp"

          mv "$HOME/android-sdk/cmdline-tools/temp/cmdline-tools/"* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          rm -rf "$HOME/android-sdk/cmdline-tools/temp"
          rm -f "$HOME/android-sdk/commandlinetools.zip"

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Check SDK manager
        run: |
          java -version
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check AIDL
        run: |
          echo "Checking AIDL..."

          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

      - name: Check project
        run: |
          echo "Project files:"
          ls -la

          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: RK-Garments-APK
          path: bin/*.apk
          if-no-files-found: error
